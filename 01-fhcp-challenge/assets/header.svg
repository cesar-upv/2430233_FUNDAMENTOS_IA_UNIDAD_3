  <g fill="#0e1d31" stroke="#5eead4" stroke-width="3">
    <circle cx="900" cy="49" r="10"/><circle cx="1010" cy="113" r="10"/><circle cx="1027" cy="237" r="10"/><circle cx="957" cy="288" r="10"/><circle cx="843" cy="288" r="10"/><circle cx="771" cy="237" r="10"/><circle cx="790" cy="113" r="10"/>
