<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">FHCP Challenge — Ciclos hamiltonianos</title>
  <desc id="desc">Banner azul oscuro con un grafo de siete vértices y un ciclo cerrado resaltado en turquesa.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24334b" stroke-width="0.6"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1426"/><stop offset="1" stop-color="#172841"/></linearGradient>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect x="48" y="49" width="5" height="26" rx="2" fill="#5eead4"/>
  <g font-family="DejaVu Sans, sans-serif">
