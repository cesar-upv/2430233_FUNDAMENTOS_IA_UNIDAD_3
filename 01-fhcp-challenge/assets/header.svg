    <text x="48" y="137" fill="#f8fafc" font-size="43" font-weight="700">Ciclos</text>
    <text x="48" y="190" fill="#f8fafc" font-size="43" font-weight="700">hamiltonianos</text>
    <text x="49" y="232" fill="#cbd5e1" font-size="20">Un ciclo. Todos los vértices.</text>
    <text x="49" y="291" fill="#94a3b8" font-size="14" letter-spacing="2">GRAFOS / METAHEURÍSTICAS / EVALUACIÓN</text>
  </g>
  <g fill="none" stroke="#405575" stroke-width="2">
